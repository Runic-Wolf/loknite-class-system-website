services:
  loknite:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKNITE_LOCAL_PORT:-8788}:8788"
    volumes:
      - loknite-data:/app/.wrangler
    environment:
      WRANGLER_SEND_METRICS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/v1/health').then(r=>{process.exit(r.ok?0:1)},()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

volumes:
  loknite-data:
