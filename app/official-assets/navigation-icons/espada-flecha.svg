<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Espada e flecha</title>
  <desc id="desc">Ícone monocromático de uma espada diagonal em primeiro plano e uma flecha cruzando por trás, com uma separação clara entre as formas.</desc>
  <g fill="#000000">
    <!-- Flecha, segmento superior: atrás da espada -->
    <path id="flecha-ponta" d="M461.8 43.2C466.3 42.1 469.6 46.4 468.5 50.8L445.7 139.6C444.4 145.4 440.7 147.6 436.8 143.9L419.2 122.6L318.6 223.2L289 193.2L389.1 92.7L368.7 80.4C362.8 77.1 363.8 69.2 369.4 66.6L461.8 43.2Z"/>
    <!-- Rabinho: duas penas geométricas, sem encostar na lâmina -->
    <path id="flecha-rabinho" d="M193.3 288.8L222.5 318.3L177.8 364.2L180.0 413.8C180.1 415.5 179.4 417.0 178.2 418.2L130.4 466.7C126.4 470.8 121.7 468.7 121.3 463.0L118.3 424.4C107.5 429.5 95.9 425.1 89.2 417.1C83.2 410.5 83.8 400.7 87.0 394.3L48.0 390.7C42.3 390.0 41.2 384.7 45.5 380.6L94.3 332.6C95.7 331.2 97.0 330.8 99.3 331.0L147.7 334.2L193.3 288.8Z"/>
    <!-- A lâmina permanece intacta, sem nenhum recorte no seu contorno -->
    <path id="espada-lamina" d="M49 43.1L60.5 43L125.9 50.5C127.5 50.8 129 51.6 130.1 52.8L340.5 274.3C343 277 342.7 280.4 340 283.1L283.1 340C280.5 342.8 278.1 342.8 275.4 340.2L52.1 127.1C51.2 126.2 50.7 124.9 50.5 123.5L43.1 49.6C42.6 45.5 44.8 43.4 49 43.1Z"/>
    <!-- Guarda da espada -->
    <path id="espada-guarda" d="M373.1 280.9C379.5 274.4 386.6 278.4 392.3 287.2C397.6 296 397.8 308.2 390.7 319.7L320.3 390.4C310.9 399.7 298.7 397.2 286 389.2C277.3 383.8 275.7 377.5 282.6 370.4L373.1 280.9Z"/>
    <!-- Punho e pomo da espada -->
    <path id="espada-punho" d="M394.4 349L349.1 394.3L400.3 445.4L412.7 461.3C420.5 470.7 433.2 470.6 442.3 464.5L464.3 442.5C472.2 434.7 470.4 421.8 462.1 412L446.7 400.2L394.4 349Z"/>
